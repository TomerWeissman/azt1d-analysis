[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "Capstone: glucose forecasting and uncertainty for type 1 diabetes (loading and analysis helpers in the azt1d package)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
